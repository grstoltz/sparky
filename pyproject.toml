[project]
name = "sparky"
version = "0.1.0"
description = "Conversational analytics over the dbt Semantic Layer, built on the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk",
  "fastapi",
  "uvicorn",
  "sse-starlette",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
